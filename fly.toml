# Fly.io app config — see https://fly.io/docs/reference/configuration/
#
# Two values you'll set during `fly launch`:
#   app             — globally unique app name (e.g. "tradovate-journal-bp")
#   primary_region  — pick a region close to you (e.g. "ord", "iad", "fra")
#
# Edit them here after `fly launch` if you need to change them later.

app = "tradovate-journal-bp"
primary_region = "fra"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # The Fly volume mounts at /data; these tell the app to write there.
  DB_PATH = "/data/journal.db"
  UPLOAD_DIR = "/data/uploads"

[http_service]
  internal_port = 3000
  force_https = true
  # SQLite + single instance = correctness. Don't ever raise these.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  # Catches deploys that fail to boot. Hits the login page since it's the only
  # known-public route — middleware returns 200 with the login HTML.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/login"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Persistent storage for SQLite + uploads. `fly volumes create tj_data` before
# the first deploy.
[mounts]
  source = "tj_data"
  destination = "/data"
  initial_size = "1gb"
