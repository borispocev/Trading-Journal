name: Deploy to Fly

on:
  push:
    branches: [main]
  # Manual re-deploy button in the Actions tab — handy when you need to redeploy
  # without pushing a commit (e.g. after rotating secrets).
  workflow_dispatch:

jobs:
  deploy:
    name: flyctl deploy
    runs-on: ubuntu-latest
    # Prevents two deploys from racing each other if you push twice in a row.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # --remote-only runs the Docker build on Fly's builder, so the GitHub
      # runner doesn't need to upload a full image. Faster + cheaper.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
